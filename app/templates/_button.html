{% macro button(url, label) -%}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
  <tr>
    <td style="border-radius:6px;background-color:#2563eb;">
      <a href="{{ url }}" target="_blank" rel="noopener" style="display:inline-block;padding:12px 24px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 16px;font-size:13px;color:#52606d;">If the button does not work, copy this link into your browser:<br><a href="{{ url }}" style="color:#2563eb;word-break:break-all;">{{ url }}</a></p>
{%- endmacro %}
