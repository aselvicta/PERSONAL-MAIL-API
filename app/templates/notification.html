{% extends "base.html" %}
{% block preheader %}{{ title }}{% endblock %}
{% block content %}
<p style="margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#a8a29e;">{{ notification_type }}</p>
<h1 style="margin:0 0 16px;font-size:22px;line-height:1.35;font-weight:600;color:#1c1917;">{{ title }}</h1>
<div style="margin:0 0 20px;white-space:pre-wrap;word-wrap:break-word;">{{ message }}</div>
{% if details %}
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="font-size:14px;border-top:1px solid #f0efed;">
  {% for key, value in details.items() %}
  <tr><td style="padding:8px 12px 8px 0;width:35%;color:#78716c;vertical-align:top;border-bottom:1px solid #f0efed;">{{ key }}</td><td style="padding:8px 0;vertical-align:top;border-bottom:1px solid #f0efed;word-break:break-word;">{{ value }}</td></tr>
  {% endfor %}
</table>
{% endif %}
{% endblock %}
