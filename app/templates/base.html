<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .pad { padding-left: 24px !important; padding-right: 24px !important; }
    }
    a { color: #1c1917; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f4;-webkit-font-smoothing:antialiased;">
  <span style="display:none!important;visibility:hidden;opacity:0;height:0;width:0;max-height:0;max-width:0;overflow:hidden;mso-hide:all;">{% block preheader %}{% endblock %}</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f4;">
    <tr>
      <td align="center" style="padding:40px 12px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;background-color:#ffffff;border:1px solid #e7e5e4;border-radius:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1917;">
          <tr>
            <td class="pad" style="padding:32px 40px 0;font-size:14px;font-weight:600;letter-spacing:0.01em;color:#1c1917;">{{ app_name }}</td>
          </tr>
          <tr>
            <td class="pad" style="padding:24px 40px 40px;font-size:15px;line-height:1.65;color:#292524;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          {% if self.footer() | trim %}
          <tr>
            <td class="pad" style="padding:20px 40px;border-top:1px solid #f0efed;font-size:12px;line-height:1.6;color:#78716c;">{% block footer %}{% endblock %}</td>
          </tr>
          {% endif %}
        </table>
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;">
          <tr>
            <td align="center" style="padding:20px 12px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#a8a29e;">Powered by Personal Mail API</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
